[project]
name = "backend"
version = "0.1.0"
description = "Second brain backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "fastapi>=0.110.0",
    "greenlet>=3.5.1",
    "pgvector>=0.4.2",
    "pydantic>=2.6.0",
    "python-dotenv>=1.2.2",
    "sqlalchemy>=2.0.50",
    "uvicorn>=0.28.0",
    "instructor>=1.3.0",
    "openai>=1.12.0",
    "networkx>=3.6.1",
    "ortools>=9.8.0",
    "pgmpy>=1.1.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "ruff>=0.3.0",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "ARG"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
